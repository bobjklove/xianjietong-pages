<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>限界通技术支持</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2328;
      background: #f6f8fa;
      line-height: 1.65;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    article {
      background: #fff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 32px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    h2 {
      margin-top: 32px;
      font-size: 20px;
    }
    p {
      margin: 10px 0;
    }
    .muted {
      color: #656d76;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>限界通技术支持</h1>
      <p class="muted">铁路建筑限界快速计算与本地测量台账工具</p>

      <h2>常见问题</h2>
      <p><strong>是否需要登录账号？</strong></p>
      <p>不需要。限界通第一版不提供在线账号体系。</p>

      <p><strong>数据是否会上传？</strong></p>
      <p>不会。测量记录、自定义标准、计算快照和配置包默认保存在本机。</p>

      <p><strong>Pro 专业工具箱包含什么？</strong></p>
      <p>Pro 专业工具箱用于解锁本机自定义标准、自定义曲线修正规则、配置包和增强导出等高级功能。</p>

      <p><strong>为什么内置标准不可直接修改？</strong></p>
      <p>内置标准随 App 打包，只读加载。需要修改时，请复制为自定义标准或新建空白草稿，以保证内置标准可复核。</p>

      <h2>问题反馈</h2>
      <p>反馈问题时，建议说明设备型号、iOS 版本、App 版本和问题出现步骤。</p>
      <p>开发者：Fan Wei</p>
    </article>
  </main>
</body>
</html>
